---
name: "Audit Toolchain"
description: "Setup a stable Rust toolchain with no bells and whistles so cargo-deny works"

inputs:
  toolchain:
    description: "Rustup toolchain"
    required: true
    default: "stable"
  override-dir:
    description: "Directory to set the rustup override for"
    required: false
    default: "."

runs:
  using: "composite"
  env:
    TOOLCHAIN: ${{ inputs.toolchain }}
  steps:
    - name: Install toolchain
      shell: bash
      working-directory: ${{ inputs.override-dir }}
      run: |
        rustup toolchain install "$TOOLCHAIN" --profile minimal

    - name: Update toolchain
      shell: bash
      working-directory: ${{ inputs.override-dir }}
      run: |
        rustup update "$TOOLCHAIN"

    - name: Set default toolchain override
      shell: bash
      working-directory: ${{ inputs.override-dir }}
      run: |
        # https://rust-lang.github.io/rustup/overrides.html
        rustup override set "$TOOLCHAIN"

    - name: Show rustup version
      shell: bash
      working-directory: ${{ inputs.override-dir }}
      run: |
        rustup -Vv

    - name: Show rustc version
      shell: bash
      working-directory: ${{ inputs.override-dir }}
      run: |
        rustc +"$TOOLCHAIN" -Vv

    - name: Show cargo version
      shell: bash
      working-directory: ${{ inputs.override-dir }}
      run: |
        cargo +"$TOOLCHAIN" version --verbose
