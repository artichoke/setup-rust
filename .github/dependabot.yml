---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/audit"
      - "/build-and-test"
      - "/check-minimal-versions"
      - "/code-coverage"
      - "/lint-and-format"
      - "/miri"
      - "/rustdoc"
    schedule:
      interval: "monthly"
    groups:
      gha-deps:
        patterns:
          - "*"
    assignees:
      - lopopolo
    labels:
      - A-deps
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    groups:
      bundler-deps:
        patterns:
          - "*"
    assignees:
      - lopopolo
    labels:
      - A-deps
